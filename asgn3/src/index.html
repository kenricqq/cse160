<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		<script src="../geometry/Cube.js"></script>

		<script src="script.js"></script>
		<style>
			body {
				margin: 1rem;
				font-family: 'Trebuchet MS', 'Gill Sans', sans-serif;
			}
			
			canvas,
			#refImg {
				display: block;
				margin-bottom: 1rem;
			}
			
			.control-panel {
				max-width: 900px;
			}
			
			.control-group {
				padding: 0.8rem 1rem;
				margin: 0 0 0.75rem;
				border-radius: 0.3rem;
				border: 1px solid #000000;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
			}
			
			h4 {
				margin: 0 0 0.5rem;
			}
			
			button {
				margin: 0.1rem 0.35rem 0.1rem 0;
			}
			
			label {
				margin-right: 0.3rem;
			}
			
			input[type='range'] {
				margin: 0 0.75rem 0 0;
				vertical-align: middle;
			}
			
			.pause-overlay {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: rgba(0, 0, 0, 0.6);
				color: white;
				text-align: center;
				z-index: 10;
			}
			
			.pause-menu {
				padding: 2rem 3rem;
				border: 2px solid white;
				border-radius: 0.5rem;
				background: rgba(0, 0, 0, 0.8);
			}
			
			.pause-menu h1 {
				margin: 0 0 0.5rem;
			}
			
			[hidden] {
				display: none !important;
			}
			
			@media (prefers-reduced-motion: reduce) {
				button {
					transition: none;
				}
			}
		</style>
	</head>

	<body>
		WASD to move. Q/E to turn camera. F/R to add/remove blocks. Esc to pause. X for craziness.

		<div id="pauseOverlay" class="pause-overlay" hidden>
			<div class="pause-menu">
				<h1>Paused</h1>
				<p>Press Space or click the scene to enter</p>
			</div>
		</div>

		<canvas id="webgl" width="1200" height="1000">
			Please use a browser that supports "canvas"
		</canvas>
