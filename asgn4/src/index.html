<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Phong Lighting World</title>
		<link rel="icon" href="data:,">
		<script src="../lib/webgl-utils.js"></script>
		<script src="../lib/webgl-debug.js"></script>
		<script src="../lib/cuon-utils.js"></script>
		<script src="../lib/cuon-matrix-cse160.js"></script>
		<script src="../lib/webgl-helpers.js"></script>
		<script src="../geometry/Geometry.js"></script>
		<script src="../geometry/Cube.js"></script>
		<script src="../geometry/Sphere.js"></script>
		<script src="../geometry/ObjModel.js"></script>
		<script src="map.js"></script>
		<script src="camera.js"></script>
		<script src="script.js"></script>
		<style>
			body {
				margin: 1rem;
				font-family: 'Trebuchet MS', 'Gill Sans', sans-serif;
			}
			
			canvas,
			#refImg {
				display: block;
				margin-bottom: 1rem;
			}
			
			.control-panel {
				max-width: 900px;
			}
			
			.control-group {
				padding: 0.8rem 1rem;
				margin: 0 0 0.75rem;
				border-radius: 0.3rem;
				border: 1px solid #000000;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
			}
			
			h4 {
				margin: 0 0 0.5rem;
			}
			
			button {
				margin: 0.1rem 0.35rem 0.1rem 0;
			}
			
			label {
				margin-right: 0.3rem;
			}
			
			input[type='range'] {
				margin: 0 0.75rem 0 0;
				vertical-align: middle;
			}
			
			@media (prefers-reduced-motion: reduce) {
				button {
					transition: none;
				}
			}
		</style>
	</head>

	<body>
		WASD move. Q/E turn.

		<canvas id="webgl" width="1200" height="1000">
			Please use a browser that supports "canvas"
		</canvas>

		<div class="control-panel">
			<div class="control-group">
				<button id="lightingToggle" type="button">Lighting: on</button>
				<button id="normalToggle" type="button">Normals: off</button>
				<button id="pointLightToggle" type="button">Point light: on</button>
				<button id="spotLightToggle" type="button">Spot light: on</button>
			</div>

			<div class="control-group">
				<h4>Point light</h4>
				<label for="pointLightX">X</label>
				<input type="range" id="pointLightX" name="pointLightX" min="-8" max="8" step="0.1" value="0">
				<label for="lightRed">R</label>
				<input type="range" id="lightRed" name="lightRed" min="0" max="100" value="100">
				<label for="lightGreen">G</label>
				<input type="range" id="lightGreen" name="lightGreen" min="0" max="100" value="100">
				<label for="lightBlue">B</label>
				<input type="range" id="lightBlue" name="lightBlue" min="0" max="100" value="100">
			</div>
		</div>
	</body>
</html>
